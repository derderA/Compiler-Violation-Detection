<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>修改密码 · GitLab 仓库违规审核工具</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <nav class="page-nav">
        <a href="/" class="nav-link">报告生成</a>
        <a href="/verify.html" class="nav-link">验证报告</a>
        <a href="/password.html" class="nav-link active">修改密码</a>
      </nav>

      <section class="hero card">
        <div class="hero-badge">管理员工作台</div>
        <h1>修改密码</h1>
        <p class="hero-lead">修改管理员登录密码，修改成功后需要重新登录。仅管理员可操作。</p>
      </section>

      <section class="card">
        <div class="section-heading">
          <div>
            <h2>修改密码</h2>
            <p class="muted">密码以 scrypt 加盐哈希存储，不保存明文。</p>
          </div>
          <button id="password-logout" class="ghost-button" type="button">退出登录</button>
        </div>
        <form id="change-password-form" class="admin-form">
          <label>
            <span>当前密码</span>
            <input id="current-password" type="password" autocomplete="current-password" required />
          </label>
          <label>
            <span>新密码（至少 6 位）</span>
            <input id="new-password" type="password" autocomplete="new-password" required />
          </label>
          <div class="actions">
            <button type="submit" id="change-password-btn">确认修改</button>
          </div>
        </form>
        <p id="change-password-status" class="status-text hidden"></p>
      </section>
    </main>

    <script type="module" src="/password.js"></script>
  </body>
</html>
